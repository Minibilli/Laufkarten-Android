name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p ausgabe
          cp app/build/outputs/apk/release/app-release.apk "ausgabe/Laufkarten-Rueckmeldung-1.0.${{ github.run_number }}.apk"

      - name: APK als Download am Workflow-Lauf
        uses: actions/upload-artifact@v4
        with:
          name: Laufkarten-Rueckmeldung-APK
          path: ausgabe/*.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rückmelde-App 1.0.${{ github.run_number }}
          body: |
            Automatisch gebaute APK der Laufkarten-Rückmelde-App.
            Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben).
          files: ausgabe/*.apk
          make_latest: true
